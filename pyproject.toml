[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "multicellular-transformer"
version = "0.0.1"
description = "Learning context-aware gene co-regulation across cells with Multicellular Transformer."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Maciej Wiatrak"},
]
maintainers = [
    {name = "Maciej Wiatrak", email = "wiatrakm@gene.com"},
]
urls.Documentation = "https://multicellular-transformer.readthedocs.io/"
urls.Source = "https://github.com/macwiatrak/multicellular-transformer"
urls.Home-page = "https://github.com/macwiatrak/multicellular-transformer"
dependencies = [
    "anndata~=0.10.8",
    "cellarr~=0.2.2",
    "dataclasses-json~=0.6",
    "gseapy~=1.1.4",
    "igraph~=0.11.8",
    "leidenalg~=0.10.2",
    "lightning~=2.3.3",
    "matplotlib~=3.9.2",
    "pandas~=2.2.2",
    "pyarrow~=18.1.0",
    "seaborn>=0.13.2",
    "scanpy~=1.10.2",
    "scikit-learn~=1.5.1",
    "scikit-misc~=0.4.0",
    "torch~=2.3.1",
    "typed-argument-parser~=1.10.1",
    "tqdm",
    # for debug logging (referenced from the issue template)
    "session-info",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "ruff>=0.5",
    "twine>=4.0.2",
]
doc = [
    "docutils>=0.8,!=0.18.*,!=0.19.*",
    "sphinx>=4",
    "sphinx-book-theme>=1.0.0",
    "myst-nb>=1.1.0",
    "sphinxcontrib-bibtex>=1.0.0",
    "setuptools",  # Until pybtex >0.23.0 releases: https://bitbucket.org/pybtex-devs/pybtex/issues/169/
    "sphinx-autodoc-typehints",
    "sphinxext-opengraph",
    # For notebooks
    "ipykernel",
    "ipython",
    "sphinx-copybutton",
    "pandas",
]
test = [
    "pytest~=8.2.2",
    "coverage",
]
tutorials = [
    "gdown>=5.0",
    "ipykernel",
    "jupyterlab",
]
tracking = [
    "wandb>=0.16",
]

[tool.coverage.run]
source = ["cell_cell_interactions"]
omit = [
    "**/test_*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
addopts = [
    "--import-mode=importlib",  # allow using test files with same name
]

[tool.ruff]
src = ["cell_cell_interactions"]
line-length = 120
extend-include = ["*.ipynb"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F",  # Errors detected by Pyflakes
    "E",  # Error detected by Pycodestyle
    "W",  # Warning detected by Pycodestyle
    "I",  # isort
    "D",  # pydocstyle
    "B",  # flake8-bugbear
    "TID",  # flake8-tidy-imports
    "C4",  # flake8-comprehensions
    "BLE",  # flake8-blind-except
    "UP",  # pyupgrade
    "RUF100",  # Report unused noqa directives
]
ignore = [
    # line too long -> we accept long comment lines; formatter gets rid of long code lines
    "E501",
    # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
    "E731",
    # allow I, O, l as variable names -> I is the identity matrix
    "E741",
    # Missing docstring in public package
    "D104",
    # Missing docstring in public module
    "D100",
    # Missing docstring in __init__
    "D107",
    # Errors from function calls in argument defaults. These are fine when the result is immutable.
    "B008",
    # __magic__ methods are often self-explanatory, allow missing docstrings
    "D105",
    # first line should end with a period [Bug: doesn't work with single-line docstrings]
    "D400",
    # First line should be in imperative mood; try rephrasing
    "D401",
    ## Disable one in each pair of mutually incompatible rules
    # We don’t want a blank line before a class docstring
    "D203",
    # We want docstrings to start immediately after the opening triple quote
    "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"docs/*" = ["I"]
"tests/*" = ["D"]
"*/__init__.py" = ["F401"]

[tool.cruft]
skip = [
    "tests",
    "notebooks",
    "scimilarity_gred",
    "docs/api.md",
    "docs/changelog.md",
    "docs/references.bib",
    "docs/references.md",
    "docs/notebooks/example.ipynb",
]
[tool.hatch.build.targets.wheel]
packages = ["cell_cell_interactions"]
